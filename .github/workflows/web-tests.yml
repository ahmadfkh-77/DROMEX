# DROMEX web workspace tests on a stable Linux clock (phase CI-1).
#
# Runs the web API typecheck, unit tests and Testcontainers integration tests
# on GitHub-hosted Ubuntu. A 150-second clock-stability check runs first: the
# session, TOTP and rate-limit tests depend on exact timestamps, so results
# from a jumping clock are not evidence.
#
# This repository is public and so are these logs. Never print environment
# variables, connection strings or anything from web/.env. No secrets, no
# deployment, no VPS access.

name: Web tests

on:
  push:
    branches:
      - web/phase2c-auth-foundation
      # Verification branches: a change is proven here on a stable clock
      # before the feature branch is moved to the same commit (DEC-491).
      - 'verify/**'
    paths:
      - 'web/**'
      - '.github/workflows/web-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-tests:
    name: Web typecheck, unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # DROMEX strict clock gate. A network-less container samples its wall
      # clock (Date.now) against its monotonic clock (performance.now) every
      # 500 ms for 150 seconds; drift is the wall time elapsed minus the
      # monotonic time elapsed. The job fails before any test runs when:
      #   - any sample-to-sample correction of the drift exceeds 5 ms;
      #   - the cumulative drift at the end of the run exceeds 5 ms;
      #   - 5 or more consecutive samples carry a correction of the same sign
      #     (a recurring pattern or systematic slew rather than noise).
      # Date.now() has 1 ms resolution, so on a stable clock the drift moves by
      # less than 1 ms per sample from rounding alone. Only changes larger than
      # 1 ms count as corrections for the pattern check; the 5 ms limits apply
      # to every sample. On a Linux runner the container shares the host
      # kernel clock, so no separate host-versus-container comparison is made.
      - name: Clock-stability gate (150 s, 500 ms samples, 5 ms limits, pattern check)
        working-directory: ${{ github.workspace }}
        run: |
          docker run --rm -i --network none node:24.20.0-trixie-slim node - <<'EOF'
          const INTERVAL_MS = 500;
          const DURATION_MS = 150_000;
          const CORRECTION_LIMIT_MS = 5;
          const DRIFT_LIMIT_MS = 5;
          const RESOLUTION_MS = 1;
          const PATTERN_RUN_LIMIT = 5;
          const wall0 = Date.now();
          const mono0 = performance.now();
          let samples = 0;
          let drift = 0;
          let previousDrift = 0;
          let maxDrift = 0;
          let maxCorrection = 0;
          let overLimit = 0;
          let runSign = 0;
          let run = 0;
          let longestRun = 0;
          const timer = setInterval(() => {
            const elapsedMono = performance.now() - mono0;
            drift = (Date.now() - wall0) - elapsedMono;
            const correction = drift - previousDrift;
            const size = Math.abs(correction);
            if (size > maxCorrection) maxCorrection = size;
            if (size > CORRECTION_LIMIT_MS) overLimit += 1;
            const sign = size > RESOLUTION_MS ? Math.sign(correction) : 0;
            run = sign === 0 ? 0 : sign === runSign ? run + 1 : 1;
            runSign = sign;
            if (run > longestRun) longestRun = run;
            if (Math.abs(drift) > Math.abs(maxDrift)) maxDrift = drift;
            previousDrift = drift;
            samples += 1;
            if (elapsedMono >= DURATION_MS) {
              clearInterval(timer);
              const failures = [];
              if (overLimit > 0) failures.push(`${overLimit} correction(s) over ${CORRECTION_LIMIT_MS} ms`);
              if (Math.abs(drift) > DRIFT_LIMIT_MS) failures.push(`cumulative drift over ${DRIFT_LIMIT_MS} ms`);
              if (longestRun >= PATTERN_RUN_LIMIT) failures.push(`recurring same-sign correction run of ${longestRun}`);
              console.log(`Samples: ${samples}`);
              console.log(`Cumulative drift at end: ${drift.toFixed(2)} ms (limit ${DRIFT_LIMIT_MS} ms)`);
              console.log(`Largest drift during run: ${maxDrift.toFixed(2)} ms`);
              console.log(`Largest single correction: ${maxCorrection.toFixed(2)} ms (limit ${CORRECTION_LIMIT_MS} ms)`);
              console.log(`Longest same-sign run of corrections over ${RESOLUTION_MS} ms: ${longestRun} (fails at ${PATTERN_RUN_LIMIT})`);
              console.log(`Result: ${failures.length === 0 ? 'PASS' : `FAIL (${failures.join('; ')})`}`);
              process.exitCode = failures.length === 0 ? 0 : 1;
            }
          }, INTERVAL_MS);
          EOF

      - name: Set up Node.js 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Show versions
        run: |
          node -v
          npm -v
          docker version --format 'Docker client {{.Client.Version}}, server {{.Server.Version}}'

      - name: Pre-pull postgres:18.6-trixie (3 attempts)
        run: |
          for attempt in 1 2 3; do
            if docker pull postgres:18.6-trixie; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Pull attempt $attempt failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "Could not pull postgres:18.6-trixie after 3 attempts."
          exit 1

      - name: Install dependencies (npm ci)
        run: npm ci

      # Runs from the repository root so the path matches; from web/ the same
      # pathspec would match nothing and always pass.
      - name: Lockfile guard
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- web/package-lock.json

      - name: Typecheck (API and web app)
        run: npm run typecheck

      - name: API unit tests
        run: npm run test:unit --workspace @dromex/api

      # The output is saved so the next step can explain a failure in the job
      # annotations and summary. pipefail keeps the test command's own exit code.
      - name: API integration tests
        id: integration
        run: |
          set -o pipefail
          npm run test:integration --workspace @dromex/api 2>&1 | tee "$RUNNER_TEMP/integration.log"

      # Diagnostic only (CI diagnostics branch): prints test counts, failed test
      # names and any unhandled error as public annotations and a job summary,
      # with connection strings and credential-shaped values redacted. It never
      # changes the result of the job.
      - name: Explain the integration run (counts, failed tests, unhandled errors)
        if: always() && steps.integration.outcome != 'skipped'
        continue-on-error: true
        env:
          LOG_PATH: ${{ runner.temp }}/integration.log
          INTEGRATION_OUTCOME: ${{ steps.integration.outcome }}
        run: |
          node --input-type=module - <<'EOF'
          // Explains an integration-test run in the job annotations and job summary.
          // Reads the saved test output; never changes the result of the job.
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';

          const logPath = process.env.LOG_PATH ?? '';
          const summaryPath = process.env.GITHUB_STEP_SUMMARY ?? '';
          const outcome = process.env.INTEGRATION_OUTCOME ?? 'unknown';
          const raw = logPath !== '' && existsSync(logPath) ? readFileSync(logPath, 'utf8') : '';
          const text = raw.replace(/\u001b\[[0-9;]*[A-Za-z]/g, '');
          const lines = text.split('\n');

          // The logs are public: connection strings and credential-shaped values never leave this step.
          const redact = (value) =>
            value
              .replace(/postgres(?:ql)?:\/\/\S+/gi, 'postgres://[redacted]')
              .replace(/\b(password|passwd|pwd|secret|token|cookie)\b\s*[=:]\s*\S+/gi, '$1=[redacted]')
              .slice(0, 400);
          const annotationText = (value) => value.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          const first = (pattern) => lines.find((line) => pattern.test(line))?.trim();

          const filesLine = first(/^\s*Test Files\s/);
          const testsLine = first(/^\s*Tests\s/);
          const failedTests = [...new Set(lines.filter((line) => /^\s*FAIL\s/.test(line)).map((line) => redact(line.trim())))];

          const unhandledStart = lines.findIndex((line) => /Unhandled (Errors?|Rejections?)/.test(line));
          const unhandled = unhandledStart < 0 ? [] : lines.slice(unhandledStart, unhandledStart + 40).map((line) => redact(line.trimEnd())).filter((line) => line.trim() !== '');
          const connectionLines = [...new Set(lines.filter((line) => /57P01|terminating connection|Connection terminated|ECONNRESET/i.test(line)).map((line) => redact(line.trim())))].slice(0, 6);

          const counts = [filesLine, testsLine].filter(Boolean).join(' | ') || 'no vitest summary line found in the output';
          console.log(`::notice title=Integration test counts (${outcome})::${annotationText(redact(counts))}`);
          for (const name of failedTests.slice(0, 8)) console.log(`::error title=Failed integration test::${annotationText(name)}`);
          if (unhandled.length > 0) {
            console.log(`::error title=Unhandled error during the integration run::${annotationText(unhandled.slice(0, 18).join('\n'))}`);
          }
          if (outcome === 'failure' && failedTests.length === 0) {
            const why = unhandled.length > 0 ? 'unhandled error(s) were reported (see the other annotation)' : 'no failed test and no unhandled error were found in the output';
            console.log(`::error title=Integration step failed with no failed test::${annotationText(why)}`);
          }

          if (summaryPath !== '') {
            const out = ['## Integration test run', '', `- Step outcome: **${outcome}**`, `- ${counts}`, `- Failed tests: **${failedTests.length}**`, `- Unhandled-error block present: **${unhandled.length > 0 ? 'yes' : 'no'}**`, ''];
            if (failedTests.length > 0) out.push('### Failed tests', '', ...failedTests.map((name) => `- \`${name}\``), '');
            if (unhandled.length > 0) out.push('### Unhandled error output (first lines, redacted)', '', '```', ...unhandled, '```', '');
            if (connectionLines.length > 0) out.push('### Connection-termination lines seen', '', '```', ...connectionLines, '```', '');
            appendFileSync(summaryPath, out.join('\n') + '\n');
          }
          EOF

      # Web app tests (phase 4b-1). Both run against the stubbed API only: the
      # browser tests replace every /api call at the network layer, so they show
      # how the sign-in screen behaves in a real browser, not how it behaves
      # with the real API (that is a later phase). The browser is the Google
      # Chrome already installed on the runner image; nothing is downloaded.
      # A run that finds no tests fails the step.
      - name: Show browser versions
        run: |
          node -v
          google-chrome --version

      - name: Web unit tests
        id: webunit
        run: |
          set -o pipefail
          npm run test:unit --workspace @dromex/web 2>&1 | tee "$RUNNER_TEMP/web-unit.log"
          node -e "const t=require('fs').readFileSync(process.env.RUNNER_TEMP+'/web-unit.log','utf8').replace(/\u001b\[[0-9;]*[A-Za-z]/g,'');const m=t.match(/^(?:ℹ|#) tests (\d+)/m);if(!m||Number(m[1])<1){console.error('::error::The web unit run found no tests.');process.exit(1)}"

      - name: Web browser tests (Playwright, installed Google Chrome, stubbed API)
        id: webbrowser
        env:
          DROMEX_PLAYWRIGHT_CHANNEL: chrome
        run: |
          set -o pipefail
          npm run test:e2e --workspace @dromex/web -- e2e/signin.spec.ts 2>&1 | tee "$RUNNER_TEMP/web-browser.log"
          node -e "const t=require('fs').readFileSync(process.env.RUNNER_TEMP+'/web-browser.log','utf8').replace(/\u001b\[[0-9;]*[A-Za-z]/g,'');const m=t.match(/^\s*(\d+) passed/m);if(!m||Number(m[1])<1){console.error('::error::The browser run found no passing tests.');process.exit(1)}"

      # Real end-to-end sign-in tests (phase 4b-2, decision D5): the real API, a
      # disposable PostgreSQL container, synthetic accounts that exist only in
      # that container, and the built web app in the installed Google Chrome.
      # Every generated secret is masked before it is written to the job
      # environment file. No command echo, no artifact upload, no trace.
      - name: E2E database (disposable PostgreSQL, CI only)
        id: e2edb
        run: |
          set -eu
          db_password="$(openssl rand -hex 24)"
          auth_secret="$(openssl rand -hex 32)"
          db_name="dromex_e2e_$(openssl rand -hex 8)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$auth_secret"
          database_url="postgresql://postgres:${db_password}@127.0.0.1:55432/${db_name}"
          echo "::add-mask::$database_url"
          docker run -d --name dromex-e2e-db -e POSTGRES_PASSWORD="$db_password" -e POSTGRES_DB="$db_name" -p 127.0.0.1:55432:5432 postgres:18.6-trixie > /dev/null
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec dromex-e2e-db pg_isready -h 127.0.0.1 -U postgres -d "$db_name" > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "The disposable database did not become ready."
            exit 1
          fi
          {
            echo "DROMEX_E2E=disposable-ci-database"
            echo "DATABASE_URL=${database_url}"
            echo "DROMEX_AUTH_SECRETS=1:${auth_secret}"
            echo "DROMEX_ENVIRONMENT=test"
            echo "DROMEX_AUTH_BASE_URL=http://127.0.0.1:5174"
            echo "DROMEX_AUTH_TRUSTED_ORIGINS=http://127.0.0.1:5174"
          } >> "$GITHUB_ENV"

      - name: E2E synthetic accounts (disposable database only)
        working-directory: web/apps/api
        run: node tests/e2e-support/seed.ts

      - name: Real end-to-end sign-in tests (real API, installed Google Chrome)
        id: e2e
        env:
          DROMEX_PLAYWRIGHT_CHANNEL: chrome
        run: |
          set -o pipefail
          npx playwright test -c playwright.e2e.config.ts 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          node -e "const t=require('fs').readFileSync(process.env.RUNNER_TEMP+'/e2e.log','utf8').replace(/\u001b\[[0-9;]*[A-Za-z]/g,'');const m=t.match(/^\s*(\d+) passed/m);if(!m||Number(m[1])<1){console.error('::error::The end-to-end run found no passing tests.');process.exit(1)}"
        working-directory: web/apps/web

      - name: Remove the E2E database
        if: always()
        run: docker rm -f dromex-e2e-db > /dev/null 2>&1 || true

      # Diagnostic only: prints each failed end-to-end test as an annotation with
      # ONLY its title, status, duration and error class name. Never the error
      # message, a stack, a request or response body, or any value. The JSON
      # report stays in the runner's temp directory and is never uploaded.
      - name: Explain the end-to-end failures (title, status, duration, error class only)
        if: always() && steps.e2e.outcome != 'skipped'
        continue-on-error: true
        env:
          E2E_REPORT: ${{ runner.temp }}/e2e-report.json
        run: |
          node --input-type=module - <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          const path = process.env.E2E_REPORT ?? '';
          if (path === '' || !existsSync(path)) {
            console.log('::warning title=End-to-end report::No JSON report was written.');
            process.exit(0);
          }
          const report = JSON.parse(readFileSync(path, 'utf8'));
          const safeTitle = (value) => String(value ?? '').replace(/[^A-Za-z0-9 ,.()'/_-]/g, '?').slice(0, 160);
          const errorClass = (error) => {
            const match = /^\s*(?:\u001b\[[0-9;]*m)*([A-Za-z]{1,40}Error|Error)\b/.exec(String(error?.message ?? ''));
            return match ? match[1] : 'unknown';
          };
          const stats = report.stats ?? {};
          console.log(`::notice title=End-to-end statuses::expected ${stats.expected ?? '?'}, unexpected ${stats.unexpected ?? '?'}, flaky ${stats.flaky ?? '?'}, skipped ${stats.skipped ?? '?'}`);
          const visit = (suite, trail) => {
            const here = suite.title ? [...trail, suite.title] : trail;
            for (const spec of suite.specs ?? []) {
              for (const test of spec.tests ?? []) {
                const last = (test.results ?? []).at(-1);
                const status = test.status === 'expected' ? 'passed' : test.status;
                if (status === 'passed') continue;
                const duration = last?.duration ?? 0;
                const cls = last?.error ? errorClass(last.error) : 'none';
                console.log(`::error title=End-to-end ${safeTitle(status)}::${safeTitle(spec.title)} | status ${safeTitle(status)} | ${duration} ms | error class ${cls}`);
              }
            }
            for (const child of suite.suites ?? []) visit(child, here);
          };
          for (const suite of report.suites ?? []) visit(suite, []);
          for (const error of report.errors ?? []) console.log(`::error title=End-to-end run error::error class ${errorClass(error)}`);
          NODE

      # Diagnostic only: prints the web unit, browser and end-to-end test counts as public
      # annotations and in the job summary. It never changes the job result.
      - name: Explain the web unit and browser runs (counts)
        if: always() && (steps.webunit.outcome != 'skipped' || steps.webbrowser.outcome != 'skipped' || steps.e2e.outcome != 'skipped')
        continue-on-error: true
        env:
          UNIT_LOG: ${{ runner.temp }}/web-unit.log
          BROWSER_LOG: ${{ runner.temp }}/web-browser.log
          UNIT_OUTCOME: ${{ steps.webunit.outcome }}
          BROWSER_OUTCOME: ${{ steps.webbrowser.outcome }}
          E2E_LOG: ${{ runner.temp }}/e2e.log
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          node --input-type=module - <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          const read = (path) => (path && existsSync(path) ? readFileSync(path, 'utf8') : '').replace(/\u001b\[[0-9;]*[A-Za-z]/g, '');
          const count = (text, pattern) => text.match(pattern)?.[1] ?? 'not found';
          const unit = read(process.env.UNIT_LOG);
          const browser = read(process.env.BROWSER_LOG);
          const e2e = read(process.env.E2E_LOG);
          const rows = [
            ['Web unit tests', process.env.UNIT_OUTCOME, `tests ${count(unit, /^(?:ℹ|#) tests (\d+)/m)}, pass ${count(unit, /^(?:ℹ|#) pass (\d+)/m)}, fail ${count(unit, /^(?:ℹ|#) fail (\d+)/m)}`],
            ['Web browser tests (stubbed API)', process.env.BROWSER_OUTCOME, `passed ${count(browser, /^\s*(\d+) passed/m)}, failed ${count(browser, /^\s*(\d+) failed/m)}, flaky ${count(browser, /^\s*(\d+) flaky/m)}`],
            ['Real end-to-end sign-in tests (real API)', process.env.E2E_OUTCOME, `passed ${count(e2e, /^\s*(\d+) passed/m)}, failed ${count(e2e, /^\s*(\d+) failed/m)}, flaky ${count(e2e, /^\s*(\d+) flaky/m)}`],
          ];
          for (const [name, outcome, counts] of rows) console.log(`::notice title=${name} (${outcome})::${counts}`);
          const summary = process.env.GITHUB_STEP_SUMMARY ?? '';
          if (summary !== '') appendFileSync(summary, ['## Web app tests', '', ...rows.map(([n, o, c]) => `- ${n}: **${o}** (${c})`), ''].join('\n') + '\n');
          NODE
