# DROMEX web: LOCAL DEVELOPMENT ONLY.
#
# Run from the "web" directory:
#   docker compose --env-file .env -f docker/docker-compose.dev.yml up --wait
#
# Port publishing rule (DEC-406, security boundary):
#   Every published port is bound to 127.0.0.1 so it is unreachable from the
#   network. Docker inserts its DNAT rules into the iptables DOCKER chain,
#   which is traversed BEFORE UFW's INPUT rules, so a "ufw deny" does NOT
#   block a port Docker has published on 0.0.0.0. Loopback binding is the
#   control that actually holds. Production PostgreSQL publishes no port.
name: dromex-web-dev

services:
  postgres:
    image: postgres:18.6-trixie
    container_name: dromex-web-dev-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Loopback only. Never "5433:5432".
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18 moved PGDATA to /var/lib/postgresql/18/docker and moved
      # the image VOLUME from /var/lib/postgresql/data to /var/lib/postgresql.
      # Mounting the old path here would silently leave the real data
      # directory in the container's writable layer, where it is destroyed on
      # container removal with no error. See docs/web/postgresql-strategy.md.
      - dromex_web_dev_pgdata:/var/lib/postgresql
    networks:
      - dromex_web_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: dromex-web-dev-api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dromex_web_dev
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: dromex-web-dev-web
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - dromex_web_dev
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  dromex_web_dev_pgdata:
    name: dromex_web_dev_pgdata

networks:
  dromex_web_dev:
    name: dromex_web_dev
    driver: bridge
